<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnglishPath Pro — A2+ → C1/C2 + IELTS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#000;--card:#0a0a0a;--card2:#131313;--card3:#1c1c1c;
    --accent:#a3e635;--accent2:#65a30d;--accent-soft:rgba(163,230,53,.12);
    --ok:#a3e635;--bad:#ef4444;--warn:#fbbf24;--info:#60a5fa;
    --text:#fff;--muted:#a1a1aa;--border:#27272a;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#142800 0%,#000 60%);
    color:var(--text);min-height:100vh;line-height:1.5}
  .app{max-width:860px;margin:0 auto;padding-bottom:96px}
  .topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
    padding:13px 18px;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .logo{font-weight:800;font-size:17px;letter-spacing:-.3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .topbar .spacer{flex:1}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;
    padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
  .badge.lvl{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;border:none}
  .badge.fire{color:var(--warn)}
  .badge.due{color:var(--accent)}
  .badge.ielts{color:var(--info)}
  .main{padding:20px 18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:16px}
  .card.flat{background:var(--card2)}
  .card.ok{border-color:rgba(163,230,53,.35)}
  .card.bad{border-color:rgba(239,68,68,.35)}
  .card.info{border-color:rgba(96,165,250,.35)}
  h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
  h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:10px}
  h3{font-size:15px;font-weight:700;margin-bottom:8px}
  p{color:var(--muted);font-size:14.5px}
  .muted{color:var(--muted);font-size:13.5px}
  .big{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
  .tiny{font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:800;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 20px;border-radius:14px;border:none;cursor:pointer;
    font-size:15px;font-weight:800;font-family:inherit;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;
    transition:transform .12s ease,filter .12s ease;width:100%}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff}
  .btn.ok{background:linear-gradient(135deg,#a3e635,#65a30d);color:#000}
  .btn.ielts{background:linear-gradient(135deg,#60a5fa,#2563eb);color:#fff}
  .btn.small{width:auto;padding:9px 16px;font-size:13.5px;border-radius:11px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn + .btn{margin-top:10px}
  .bar{height:10px;background:var(--card3);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .5s cubic-bezier(.4,0,.2,1)}
  .bar.blue > i{background:linear-gradient(90deg,#60a5fa,#2563eb)}
  .ring-wrap{display:flex;align-items:center;gap:20px}
  .ring{position:relative;width:96px;height:96px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;
    font-weight:800;font-size:19px;letter-spacing:-.5px;color:var(--accent)}
  .grid{display:grid;gap:12px}
  .grid.g2{grid-template-columns:1fr 1fr}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .stat{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px}
  .stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent)}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:2px}
  .options{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .opt{text-align:left;padding:14px 16px;border-radius:13px;cursor:pointer;
    background:var(--card2);border:1.5px solid var(--border);color:var(--text);
    font-size:15px;font-family:inherit;font-weight:500;transition:all .15s ease}
  .opt:hover:not(:disabled){border-color:#3f3f46;background:var(--card3)}
  .opt:disabled{cursor:default}
  .opt.correct{border-color:var(--accent);background:var(--accent-soft);color:#e0f7a8}
  .opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.12);color:#ffb3b3}
  .fb{margin-top:14px;padding:13px 15px;border-radius:13px;font-size:14px;
    background:var(--card3);border-left:3px solid var(--accent);color:var(--text)}
  .fb.ok{border-left-color:var(--accent)}
  .fb.bad{border-left-color:var(--bad)}
  .fb.info{border-left-color:var(--info)}
  .speak{background:var(--card3);border:1px solid var(--border);color:var(--accent);
    border-radius:11px;padding:7px 13px;cursor:pointer;font-size:15px;font-family:inherit;font-weight:600}
  .speak:active{transform:scale(.95)}
  .passage{background:var(--card2);border:1px solid var(--border);border-radius:14px;
    padding:16px;font-size:15px;line-height:1.7;color:#d4d4d8;margin-bottom:16px}
  .step-label{font-size:11.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px}
  .word-big{font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;color:var(--accent)}
  .vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
  .vrow:last-child{border-bottom:none}
  .vrow .en{font-weight:700;font-size:15px}
  .vrow .ru{color:var(--muted);font-size:13.5px}
  .vrow .ex{color:#71717a;font-size:12.5px;font-style:italic;margin-top:2px}
  .vrow .mini{background:var(--card3);border:1px solid var(--border);color:var(--accent);
    border-radius:9px;padding:6px 9px;cursor:pointer;font-size:14px}
  textarea{width:100%;min-height:140px;background:var(--card2);border:1px solid var(--border);
    border-radius:13px;padding:14px;color:var(--text);font-family:inherit;font-size:15px;
    resize:vertical;line-height:1.6}
  textarea:focus{outline:none;border-color:var(--accent)}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;
    background:rgba(0,0,0,.94);backdrop-filter:blur(16px);border-top:1px solid var(--border)}
  .nav button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;
    padding:11px 0 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;font-weight:700;letter-spacing:.2px;transition:color .15s}
  .nav button .ic{font-size:17px;line-height:1}
  .nav button.active{color:var(--accent)}
  .center{text-align:center}
  .mt{margin-top:16px}.mb{margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center}
  .hidden{display:none!important}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .pill{font-size:11px;padding:4px 10px;border-radius:999px;background:var(--card3);
    color:var(--muted);font-weight:700}
  .pill.hot{background:rgba(239,68,68,.15);color:#fca5a5}
  .pill.warm{background:rgba(251,191,36,.15);color:#fcd34d}
  .pill.cool{background:var(--accent-soft);color:var(--accent)}
  .pill.info{background:rgba(96,165,250,.15);color:#93c5fd}
  .chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:14px}
  .chart > div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .chart .b{width:100%;border-radius:6px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
  .chart .l{font-size:10px;color:var(--muted)}
  .phase{margin-bottom:18px}
  .phase-head{display:flex;align-items:center;gap:12px;
    padding:14px 16px;border-radius:14px;margin-bottom:10px;
    background:linear-gradient(135deg,rgba(163,230,53,.1),rgba(101,163,13,.05));
    border:1px solid var(--border)}
  .phase-head.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .phase-head .ph-title{font-weight:800;font-size:14.5px;color:var(--accent)}
  .phase-head .ph-goal{font-size:12px;color:var(--muted);margin-top:2px}
  .phase-head .ph-prog{font-size:12px;font-weight:800;color:var(--text)}
  .month-row{display:flex;align-items:center;gap:12px;padding:10px 12px;
    border-radius:10px;margin-bottom:6px;background:var(--card2);border:1px solid var(--border)}
  .month-row.current{border-color:var(--accent);background:var(--accent-soft)}
  .month-row .mn{font-size:12px;font-weight:700;color:var(--muted);min-width:52px}
  .month-row.current .mn{color:var(--accent)}
  .month-row .dots{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
  .month-row .dot{aspect-ratio:1;border-radius:3px;background:var(--card3)}
  .month-row .dot.done{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .month-row .dot.next{box-shadow:0 0 0 1.5px var(--accent) inset;animation:pulse 1.8s infinite}
  .month-row .mg{font-size:11px;font-weight:700;color:var(--muted);min-width:36px;text-align:right}
  .month-row.current .mg{color:var(--accent)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .milestone{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:10px 0;
    border-radius:12px;background:var(--card2);border:1px dashed var(--border);
    font-size:13px;color:var(--muted)}
  .milestone.reached{background:var(--accent-soft);border-style:solid;border-color:var(--accent);color:var(--accent);font-weight:700}
  .milestone.blue{border-color:rgba(96,165,250,.5);color:#93c5fd}
  .milestone.blue.reached{background:rgba(96,165,250,.15);border-color:var(--info)}
  .recorder{background:var(--card2);border:1px solid var(--border);border-radius:14px;
    padding:16px;text-align:center;margin-top:12px}
  .rec-btn{width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;font-size:24px;
    display:inline-flex;align-items:center;justify-content:center;margin:8px}
  .rec-btn.recording{animation:pulse 1s infinite}
  .rec-btn:active{transform:scale(.95)}
  .band{font-size:48px;font-weight:800;color:var(--info);letter-spacing:-2px;line-height:1}
  .cue-card{background:linear-gradient(135deg,rgba(96,165,250,.1),rgba(37,99,235,.05));
    border:1px solid rgba(96,165,250,.3);border-radius:14px;padding:20px;margin:12px 0}
  .cue-card h4{color:var(--info);font-size:14px;margin-bottom:8px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
  .cue-card .main-q{font-size:17px;font-weight:700;color:var(--text);margin-bottom:10px}
  .cue-card ul{list-style:none;padding-left:0;margin-top:8px}
  .cue-card li{padding:4px 0 4px 18px;position:relative;color:var(--muted);font-size:14px}
  .cue-card li:before{content:"•";position:absolute;left:4px;color:var(--info)}
  .checklist{background:var(--card3);border-radius:10px;padding:12px;margin-top:10px}
  .checklist label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px;color:var(--text);cursor:pointer}
  .checklist input{margin-top:3px;accent-color:var(--accent)}
  .divider{height:1px;background:var(--border);margin:14px 0}
  @media(max-width:460px){
    .grid.g3,.grid.g4{grid-template-columns:1fr 1fr}
    .big{font-size:28px}
    .month-row .mn{min-width:40px;font-size:11px}
    .month-row .dots{gap:2px}
    .nav button{font-size:9px}
    .band{font-size:40px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main class="main" id="main"></main>
  <nav class="nav" id="nav">
    <button data-view="home"><span class="ic">🏠</span><span>Дом</span></button>
    <button data-view="map"><span class="ic">🗺️</span><span>План</span></button>

  </nav>
</div>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){return new Date().toISOString().slice(0,10)}
function speak(text, rate){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate = rate || 0.9;
  const v = speechSynthesis.getVoices().find(x=>x.lang.startsWith('en'));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

reading:[
{title:'The Paradox of Choice',
 text:'Conventional wisdom suggests that the more options we have, the happier we should be. Yet a growing body of research indicates that the opposite is often true. In one well-known experiment, shoppers who were offered twenty-four varieties of jam were far less likely to buy any than shoppers who saw only six. Psychologists call this the paradox of choice: an abundance of options increases the effort required to decide, and with it the anxiety that we may make the wrong decision. Even after we choose, we tend to regret the alternatives we rejected. This does not mean that choice is bad — only that beyond a certain point, additional options impose a hidden cost that we rarely account for.',
 qs:[{q:'What did the jam experiment show?',opts:['More choices led to more purchases','Fewer choices led to more purchases','People disliked jam','People wanted 24 varieties'],a:1},

function getCard(word){
  if(!S.cards[word]) S.cards[word] = {ef:2.5, interval:0, reps:0, due:0, lapses:0};
  return S.cards[word];
}
function reviewCard(word, quality){
  const c = getCard(word);
  if(quality < 3){ c.reps = 0; c.lapses++; c.interval = 1; }
  else {
    if(c.reps === 0) c.interval = 1;
    else if(c.reps === 1) c.interval = 6;
    else c.interval = Math.round(c.interval * c.ef);
    c.reps++;
  }
  c.ef = Math.max(1.3, c.ef + (0.1 - (5-quality)*(0.08 + (5-quality)*0.02)));
  c.due = Date.now() + c.interval * DAY_MS;
  return c;
}
function dueCards(limit){
  const now = Date.now();
  return Object.entries(S.cards)
    .filter(([w,c]) => c.due <= now)
    .sort((a,b) => a[1].due - b[1].due)
    .slice(0, limit || 20);
}

      if(!s.ieltsScores) s.ieltsScores = {listening:0,reading:0,writing:0,speaking:0};
      if(!s.ieltsHistory) s.ieltsHistory = [];
      if(!s.speakingVisited) s.speakingVisited = [];
      return s;
    }
  }catch(e){}
  return defaultState();
}
function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }

/* ============================================================
   ФАЗЫ
============================================================ */
function getPhaseLevels(){
  const startIdx = LEVELS.indexOf(S.startLevel || S.level || 'A2');
  const phase = Math.min(PHASE_COUNT - 1, Math.floor(S.day / PHASE_DAYS));
  const pIdx = Math.min(LEVELS.length - 1, startIdx + phase);
  const sIdx = Math.min(LEVELS.length - 1, pIdx + 1);
  return {primary: LEVELS[pIdx], secondary: LEVELS[sIdx], phase};
}
function currentMilestoneLevel(){
  const startIdx = LEVELS.indexOf(S.startLevel || S.level || 'A2');
  const phase = Math.min(PHASE_COUNT - 1, Math.floor(S.day / PHASE_DAYS));
  const tIdx = Math.min(LEVELS.length - 1, startIdx + phase + 1);
  return LEVELS[tIdx];
}

/* ============================================================
   IELTS BAND ESTIMATION
============================================================ */
function estimateBand(section, pct){
  if(pct === null || pct === undefined) return 0;
  if(section === 'listening' || section === 'reading'){
    if(pct >= 0.95) return 9.0;
    if(pct >= 0.90) return 8.5;
    if(pct >= 0.85) return 8.0;
    if(pct >= 0.80) return 7.5;
    if(pct >= 0.72) return 7.0;
    if(pct >= 0.65) return 6.5;
    if(pct >= 0.55) return 6.0;
    if(pct >= 0.45) return 5.5;
    if(pct >= 0.35) return 5.0;
    return 4.5;
  }
  return 0;
}
function overallBand(){
  const sc = S.ieltsScores;
  const scores = [sc.listening, sc.reading, sc.writing, sc.speaking].filter(x => x > 0);
  if(!scores.length) return 0;
  const avg = scores.reduce((a,b)=>a+b,0)/scores.length;
  return Math.round(avg * 2) / 2;
}

function buildTest(){

  const qs = [];

      const opts = shuffle(g.opts, rnd);
      qs.push({lvl, q:g.q, opts, a:opts.indexOf(correct)});
    });
  });
  return qs;
}

function renderTest(main){
  if(!T) T = {qs: buildTest(), i: 0, answers: []};

function answerTest(idx){
  const q = T.qs[T.i];

    else if(i === idx) b.classList.add('wrong');

  T.answers.push({lvl:q.lvl, correct: idx === q.a});

function finishTest(){
  const scores = {};
  LEVELS.forEach(l => scores[l] = {ok:0, total:0});
  T.answers.forEach(a => { scores[a.lvl].total++; if(a.correct) scores[a.lvl].ok++; });

    if(scores[LEVELS[i]].ok >= 3) reached = i;
    else break;

  const level = LEVELS[reached];

  S.startLevel = level;

/* ============================================================
   ГЕНЕРАЦИЯ УРОКА
============================================================ */
function buildLesson(){
  const {primary, secondary} = getPhaseLevels();
  const P1 = DATA[primary];
  const P2 = DATA[secondary];
  const day = S.day;
  const rnd = mulberry32(day * 7919 + primary.charCodeAt(0) * 131 + Date.now() % 1000);
  const items = [];
  const pick = (prob=0.35) => rnd() < prob ? P2 : P1;

  dueCards(6).forEach(([word]) => {
    const info = findWord(word, primary) || findWord(word, secondary) || findWord(word);
    if(info){
      const src = findWord(word, primary) ? P1 : (findWord(word, secondary) ? P2 : P1);
      const distractors = shuffle(src.vocab.filter(x => x.ru !== info.ru), rnd).slice(0,3).map(x => x.ru);
      const opts = shuffle([info.ru, ...distractors], rnd);
      items.push({type:'srs', data:{...info, word}, opts, a:opts.indexOf(info.ru)});
    }
  });

  // Phrasal verbs / collocations every 3rd day
  if(day % 3 === 0){
    const all = [...(P1.phrasal||[]), ...(P2.phrasal||[]), ...(P1.collocations||[]), ...(P2.collocations||[])];
    if(all.length > 0){
      const chosen = shuffle(all, rnd).slice(0, 2);
      chosen.forEach(w => {
        items.push({type:'intro', data:w, label:'Phrasal verb / Collocation'});
      });
    }
  }

  // Grammar 3
  const gPool = [];
  P1.grammar.forEach(g => gPool.push({...g, w: topicWeight(g.topic), src:'primary'}));
  P2.grammar.forEach(g => gPool.push({...g, w: topicWeight(g.topic) * 0.5, src:'secondary'}));
  const picked = weightedSample(gPool, 3, rnd);
  picked.forEach(g => {
    const correct = g.opts[g.a];
    const opts = shuffle(g.opts, rnd);
    items.push({type:'grammar', data:{q:g.q, opts, a:opts.indexOf(correct), topic:g.topic}});
  });

  // New words
  const newWords1 = P1.vocab.filter(w => !S.intro[w.en]);
  const newWords2 = P2.vocab.filter(w => !S.intro[w.en]);
  const newPool = [...shuffle(newWords1, rnd).slice(0,2), ...shuffle(newWords2, rnd).slice(0,1)];
  newPool.slice(0,3).forEach(w => {
    S.intro[w.en] = true;
    items.push({type:'intro', data:w});
  });

  // Reading / listening
  if(day % 2 === 0){
    const src = pick();
    const r = src.reading[Math.floor(rnd() * src.reading.length)];
    items.push({type:'reading', data:r});
  } else {
    const src = pick(0.4);
    const ls = shuffle(src.listening, rnd).slice(0,4);
    ls.forEach(s => {
      const others = src.listening.filter(x => x.ru !== s.ru);
      const wrong = shuffle(others, rnd).slice(0,3).map(x=>x.ru);
      const opts = shuffle([s.ru, ...wrong], rnd);
      items.push({type:'listening', data:{en:s.en, opts, a:opts.indexOf(s.ru)}});
    });
  }

  if(day % 4 === 3){
    const src = pick(0.4);
    const w = src.writing[Math.floor(rnd() * src.writing.length)];
    items.push({type:'writing', data:w});
  }

  return items;
}

function findWord(en, lvl){
  const levels = lvl ? [lvl] : LEVELS;
  for(const l of levels){
    if(!DATA[l]) continue;
    const sections = ['vocab','phrasal','collocations','academic'];
    for(const sec of sections){
      if(DATA[l][sec]){
        const w = DATA[l][sec].find(x => x.en === en);
        if(w) return w;
      }
    }
  }
  return null;
}

function topicWeight(topic){
  const w = S.weak[topic];
  if(!w) return 1;
  const total = w.right + w.wrong;
  if(total === 0) return 1;
  const acc = w.right / total;
  return 1 + (1 - acc) * 2;
}

function weightedSample(arr, n, rnd){
  const pool = arr.slice();
  const out = [];
  while(out.length < n && pool.length){
    const total = pool.reduce((s,x) => s + x.w, 0);
    let r = rnd() * total;
    for(let i = 0; i < pool.length; i++){
      r -= pool[i].w;
      if(r <= 0){ out.push(pool.splice(i,1)[0]); break; }
    }
  }
  return out;
}

function topWeak(n){
  return Object.entries(S.weak)
    .map(([topic, s]) => ({topic, acc: Math.round(s.right / (s.right+s.wrong) * 100), total: s.right+s.wrong}))
    .filter(x => x.total >= 2 && x.acc < 80)
    .sort((a,b) => a.acc - b.acc)
    .slice(0, n);
}

function checkWriting(){
  const box = document.getElementById('writingBox');
  const text = box.value.trim();
  const issues = [];
  const wc = text.split(/\s+/).filter(Boolean).length;
  if(wc < 30) issues.push('Слишком короткий текст — не менее 30 слов.');
  if(/[а-яА-Я]/.test(text)) issues.push('Обнаружены русские буквы.');
  if(/\bi am agree\b/i.test(text)) issues.push('«I am agree» → «I agree».');
  if(/\bmore better\b/i.test(text)) issues.push('«more better» → «better».');
  if(/\bdon’t has\b|\bdon't has\b/i.test(text)) issues.push('«don’t has» → «doesn’t have».');
  if(/\binformations\b/i.test(text)) issues.push('«informations» → «information».');
  if(/\badvices\b/i.test(text)) issues.push('«advices» → «advice» (неисчисляемое).');
  if(/\bpeoples\b/i.test(text)) issues.push('«peoples» → «people».');
  if(/\bthe most easiest\b/i.test(text)) issues.push('«the most easiest» → «the easiest».');
  if(/\bhow much people\b/i.test(text)) issues.push('«how much people» → «how many people».');
  if(!/[.?!]/.test(text)) issues.push('Добавьте знаки препинания.');
  if(!/\b(I|we|they|he|she|it|you)\b/i.test(text)) issues.push('Проверьте наличие подлежащего.');
  // Cohesion check
  const connectives = ['however','therefore','moreover','furthermore','nevertheless','consequently','thus','in addition','on the other hand','in contrast','as a result'];
  const hasConnective = connectives.some(c => text.toLowerCase().includes(c));
  if(wc >= 60 && !hasConnective) issues.push('Для связности добавьте linking words (however, therefore, moreover и т.п.).');

  const item = L.items[L.idx];
  const html = issues.length === 0
    ? `<div class="fb ok" style="margin-top:12px">
        <b>✅ Базовые проверки пройдены</b>
        <div style="margin-top:8px;color:var(--muted)">
          ${item.data.checklist.map(c => '✓ ' + esc(c)).join('<br>')}
        </div>
        <p class="muted" style="margin-top:8px">Для глубокой проверки — Grammarly / LanguageTool / ChatGPT.</p>
      </div>`
    : `<div class="fb bad" style="margin-top:12px">
        <b>Замечания:</b>
        <ul style="margin:8px 0 0 18px;color:var(--text)">
          ${issues.map(i => `<li>${esc(i)}</li>`).join('')}
        </ul>
      </div>`;
  document.getElementById('writingFeedback').innerHTML = html;
}

function answerStep(idx){
  if(cur.answered) return;
  cur.answered = true;
  document.querySelectorAll('#opts .opt').forEach((b,i)=>{
    b.disabled = true;
    if(i === cur.correct) b.classList.add('correct');
    else if(i === idx) b.classList.add('wrong');
  });
  const ok = idx === cur.correct;

  if(cur.srsWord) reviewCard(cur.srsWord, ok ? 4 : 1);
  if(cur.topic){
    S.weak[cur.topic] = S.weak[cur.topic] || {right:0, wrong:0};
    if(ok) S.weak[cur.topic].right++; else S.weak[cur.topic].wrong++;
  }
  if(ok) L.correct++; else L.wrong++;

  const item = L.items[L.idx];
  let extra = '';
  if(item.type === 'srs'){
    extra = `<div style="margin-top:6px"><b>${esc(cur.srsInfo.en)}</b> — ${esc(cur.srsInfo.ru)}<br>
      <span style="font-style:italic;color:var(--muted)">${esc(cur.srsInfo.ex)}</span></div>`;
    const c = getCard(cur.srsWord);
    extra += `<div class="muted" style="margin-top:6px">Следующее повторение: через ${c.interval} дн.</div>`;
  }

  document.getElementById('feedback').innerHTML = `
    <div class="fb ${ok ? 'ok' : 'bad'}">
      <b>${ok ? '✅ Верно!' : '❌ Неверно'}</b>${extra}
    </div>
    <button class="btn mt" data-action="next">Далее →</button>`;
  saveState();
}

function answerReading(qi, oi){
  const item = L.items[L.idx];
  const q = item.data.qs[qi];
  const wrap = document.querySelector(`[data-q="${qi}"]`);
  wrap.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled = true;
    if(i === q.a) b.classList.add('correct');
    else if(i === oi) b.classList.add('wrong');
  });
  if(oi === q.a) L.correct++; else L.wrong++;

  const allAnswered = [...document.querySelectorAll('#rq [data-q]')]
    .every(el => [...el.querySelectorAll('.opt')].every(b => b.disabled));
  if(allAnswered) document.getElementById('nextBtn').disabled = false;
}

function nextStep(){ L.idx++; render(); }

============================================================ */
function finishLesson(){
  const total = L.correct + L.wrong;
  const acc = total ? Math.round(L.correct/total*100) : 100;
  const xp = 20 + L.correct * 5 + (acc >= 80 ? 15 : 0);

  S.xp += xp;
  S.day = Math.min(TOTAL_DAYS, S.day + 1);

  const t = today();
  if(S.lastDay !== t){
    const y = new Date(Date.now() - DAY_MS).toISOString().slice(0,10);
    S.streak = (S.lastDay === y) ? S.streak + 1 : 1;
    S.lastDay = t;
  }

  const milestone = Math.min(PHASE_COUNT, Math.floor(S.day / PHASE_DAYS));
  if(milestone > 0){
    const startIdx = LEVELS.indexOf(S.startLevel);
    const newLvl = LEVELS[Math.min(LEVELS.length - 1, startIdx + milestone)];
    S.level = newLvl;
  }

  const last = S.history[S.history.length-1];
  if(last && last.date === t) last.xp += xp;
  else S.history.push({date:t, xp});
  if(S.history.length > 60) S.history = S.history.slice(-60);

  checkAchievements();
  saveState();

  const finished = S.day >= TOTAL_DAYS;
  const justReachedPhase = S.day === PHASE_DAYS || S.day === PHASE_DAYS * 2;

  document.getElementById('main').innerHTML = `
    <div class="card center ${finished ? 'ok' : ''}">
      <div style="font-size:52px">${finished ? '🏆' : justReachedPhase ? '🎯' : '✨'}</div>
      <h1>${finished ? 'Финиш!' : justReachedPhase ? 'Веха достигнута!' : 'Занятие завершено!'}</h1>
      <p class="mb">Правильно: ${L.correct} из ${total} (${acc}%)</p>
      <div class="grid g3" style="margin:20px 0">
        <div class="stat"><div class="v">+${xp}</div><div class="k">XP</div></div>
        <div class="stat"><div class="v">${S.streak}</div><div class="k">серия</div></div>
        <div class="stat"><div class="v">${Object.keys(S.cards).length}</div><div class="k">карточек</div></div>
      </div>
      ${justReachedPhase ? `<p class="mb">Поздравляем! Вы завершили фазу ${S.day === PHASE_DAYS ? '1 (A2+→B1)' : '2 (B1→B2)'}.</p>` : ''}
      ${finished
        ? `<p class="mb">Вы прошли всю программу! Теперь — интенсивная подготовка к IELTS.</p>
           <button class="btn ielts" data-action="go-exam">Перейти к IELTS →</button>
           <button class="btn ghost mt" data-action="retake-test">Пройти тест заново</button>`
        : `<button class="btn" data-action="go-home">На главную</button>
           <button class="btn ghost" data-action="start-lesson">Ещё занятие</button>`}
    </div>`;
  L = null;
  view = 'result';
}

function checkAchievements(){
  const list = [
    {id:'first_lesson', cond:S.day >= 1},
    {id:'streak_3', cond:S.streak >= 3},
    {id:'streak_7', cond:S.streak >= 7},
    {id:'streak_30', cond:S.streak >= 30},
    {id:'cards_50', cond:Object.keys(S.cards).length >= 50},
    {id:'cards_200', cond:Object.keys(S.cards).length >= 200},
    {id:'phase_b1', cond:S.day >= PHASE_DAYS},
    {id:'phase_b2', cond:S.day >= PHASE_DAYS * 2},
    {id:'phase_c1', cond:S.day >= TOTAL_DAYS},
    {id:'ielts_6', cond:overallBand() >= 6.0},
    {id:'ielts_65', cond:overallBand() >= 6.5},
    {id:'ielts_7', cond:overallBand() >= 7.0},
    {id:'ielts_75', cond:overallBand() >= 7.5}
  ];
  list.forEach(a => {
    if(a.cond && !S.achievements.includes(a.id)) S.achievements.push(a.id);
  });
}

function renderMap(main){
  if(!S.level){ renderWelcome(main); return; }
  const phaseNames = ['A2+ → B1', 'B1 → B2', 'B2 → C1 + экзамен'];
  const phaseGoal = ['B1 · IELTS ~5.0', 'B2 · IELTS ~6.0', 'C1 · IELTS 7.0+'];

  let html = `<div class="card"><h2>Программа · 30 месяцев</h2>
    <p>480 занятий. Три фазы по 10 месяцев. Фаза 3 включает интенсивную IELTS-подготовку.</p></div>`;

  for(let p = 0; p < 3; p++){
    const phStart = p * PHASE_DAYS;
    const phEnd = phStart + PHASE_DAYS;
    const isActive = S.day >= phStart && S.day < phEnd;
    const isDone = S.day >= phEnd;
    const doneInPhase = Math.max(0, Math.min(PHASE_DAYS, S.day - phStart));
    const phasePct = Math.round(doneInPhase / PHASE_DAYS * 100);

    html += `<div class="phase">
      <div class="phase-head ${isActive?'active':''}">
        <div style="flex:1">
          <div class="ph-title">Фаза ${p+1} · ${phaseNames[p]}</div>
          <div class="ph-goal">Месяцы ${p*10+1}–${(p+1)*10} · ${phaseGoal[p]}</div>
        </div>
        <div class="ph-prog">${isDone?'✓':phasePct + '%'}</div>
      </div>`;

    for(let m = 0; m < 10; m++){
      const monthIdx = p * 10 + m;
      const start = monthIdx * DAYS_PER_MONTH;
      const done = Math.max(0, Math.min(DAYS_PER_MONTH, S.day - start));
      const isCurMonth = S.day >= start && S.day < start + DAYS_PER_MONTH;
      let dots = '';
      for(let d = 0; d < DAYS_PER_MONTH; d++){
        const g = start + d;
        let cls = 'dot';
        if(g < S.day) cls += ' done';
        else if(g === S.day) cls += ' next';
        dots += `<div class="${cls}"></div>`;
      }
      html += `<div class="month-row ${isCurMonth?'current':''}">
        <span class="mn">Мес. ${monthIdx+1}</span>
        <div class="dots">${dots}</div>
        <span class="mg">${done}/${DAYS_PER_MONTH}</span>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div class="card info">
    <h3>🎓 В фазе 3 (месяцы 21–30)</h3>
    <p>Добавляются: IELTS-симулятор, speaking-практика, academic writing, разбор экзаменационных стратегий.</p>
    <button class="btn ielts mt" data-action="go-exam">Открыть IELTS-подготовку →</button>
  </div>`;
  main.innerHTML = html;
}

function renderDeck(main){
  if(!S.level){ renderWelcome(main); return; }
  const cards = Object.entries(S.cards)
    .map(([word, c]) => ({word, info: findWord(word), c}))
    .sort((a,b) => a.c.due - b.c.due);

  const now = Date.now();
  const due = cards.filter(x => x.c.due <= now).length;
  const soon = cards.filter(x => x.c.due > now && x.c.due < now + 7*DAY_MS).length;

  main.innerHTML = `
    <div class="card">
      <h2>Колода SRS</h2>
      <p>Алгоритм SM-2. Оценка «верно/неверно» влияет на интервал.</p>
      <div class="grid g3 mt">
        <div class="stat"><div class="v">${cards.length}</div><div class="k">всего</div></div>
        <div class="stat"><div class="v">${due}</div><div class="k">к повторению</div></div>
        <div class="stat"><div class="v">${soon}</div><div class="k">на неделе</div></div>
      </div>
      ${due > 0 ? `<button class="btn mt" data-action="review-due">Повторить ${due} сейчас</button>` : ''}
    </div>
    <div class="card">
      <h3>Экспорт</h3>
      <button class="btn ghost small" data-action="export-anki">📤 Экспорт в Anki (CSV)</button>
    </div>
    <div class="card">
      <h3>Все карточки</h3>
      ${cards.length === 0 ? '<p class="muted">Пока пусто — начните занятие.</p>' : ''}
      ${cards.map(({word, info, c}) => {
        const d = new Date(c.due);
        const dueText = c.due <= now ? 'сейчас' : d.toLocaleDateString();
        const cls = c.due <= now ? 'hot' : c.interval >= 21 ? 'cool' : 'warm';
        return `<div class="vrow">
          <div style="flex:1">
            <div class="en">${esc(word)} ${info ? `<span class="muted" style="font-weight:400">— ${esc(info.ru)}</span>`:''}</div>
            <div class="ex">повторение: ${dueText} · интервал ${c.interval} дн · EF ${c.ef.toFixed(2)}</div>
          </div>
          <span class="pill ${cls}">${c.due <= now ? 'due' : 'ok'}</span>
        </div>`;
      }).join('')}
    </div>`;
}

function exportAnki(){
  const rows = [];
  Object.entries(S.cards).forEach(([word]) => {
    const info = findWord(word);
    if(!info) return;
    rows.push(`${word};${info.ru};${info.ex}`);
  });
  if(!rows.length){ alert('Колода пуста.'); return; }
  const csv = rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `englishpath_anki_${today()}.csv`;
  a.click();
}

function startReviewDue(){
  const due = dueCards(20);
  if(!due.length){ alert('Сейчас нечего повторять.'); return; }
  const rnd = mulberry32(Date.now() % 10000);
  const items = [];
  due.forEach(([word]) => {
    const info = findWord(word);
    if(!info) return;
    let src = DATA.B2;
    if(findWord(word, 'A1')) src = DATA.A1;
    else if(findWord(word, 'A2')) src = DATA.A2;
    else if(findWord(word, 'B1')) src = DATA.B1;
    else if(findWord(word, 'B2')) src = DATA.B2;
    else if(findWord(word, 'C1')) src = DATA.C1;
    else if(findWord(word, 'C2')) src = DATA.C2;
    const dist = shuffle(src.vocab.filter(x => x.ru !== info.ru), rnd).slice(0,3).map(x=>x.ru);
    const opts = shuffle([info.ru, ...dist], rnd);
    items.push({type:'srs', data:{...info, word}, opts, a:opts.indexOf(info.ru)});
  });
  L = {items, idx:0, correct:0, wrong:0, isReview:true};
  cur = {correct:-1, answered:false};
  go('lesson');
}

/* ============================================================
   CHECKPOINT
============================================================ */
function startCheckpoint(){
  if(!S.level){ go('test'); return; }
  const {primary, secondary} = getPhaseLevels();
  const rnd = mulberry32(Date.now() % 7777);
  const qs = [];
  [...DATA[primary].grammar, ...DATA[secondary].grammar].forEach(g => {
    const correct = g.opts[g.a];
    const opts = shuffle(g.opts, rnd);
    qs.push({topic:g.topic, q:g.q, opts, a:opts.indexOf(correct)});
  });
  const sample = shuffle(qs, rnd).slice(0, 8);
  L = {items: sample.map(q => ({type:'grammar', data:q})), idx:0, correct:0, wrong:0, isCheckpoint:true};
  cur = {correct:-1, answered:false};
  go('lesson');
}

function recorderHTML(){
  return `<div class="card">
    <h3>Запись</h3>
    <p class="muted mb">Нажмите кнопку, говорите, затем остановите и прослушайте.</p>

      <div id="recStatus" class="muted">Готов к записи</div>
      <audio id="recPlayback" controls class="hidden" style="width:100%;margin-top:12px"></audio>
    </div>
    <p class="muted mt">Совет: говорите на 1–2 минуты. Слушайте себя — это самый эффективный способ улучшить speaking.</p>
  </div>`;
}

let mediaRecorder, chunks = [], isRecording = false;
async function toggleRec(){
  if(!isRecording){
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, {type:'audio/webm'});
        const url = URL.createObjectURL(blob);
        const player = document.getElementById('recPlayback');
        player.src = url;
        player.classList.remove('hidden');
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recStatus').textContent = '🔴 Запись... говорите!';
      document.getElementById('recBtn').classList.add('recording');
    } catch(e) {
      alert('Нет доступа к микрофону: ' + e.message);
    }
  } else {
    if(mediaRecorder) mediaRecorder.stop();
    isRecording = false;
    document.getElementById('recStatus').textContent = '⏹ Прослушайте запись';
    document.getElementById('recBtn').classList.remove('recording');
  }
}

function startIELTSListening(){
  const rnd = mulberry32(Date.now() % 9999);
  const set = IELTS.listeningSets[Math.floor(rnd() * IELTS.listeningSets.length)];
  const items = set.questions.map(q => {
    const correct = q.opts[q.a];
    const opts = shuffle(q.opts, rnd);
    return {q:q.q, opts, a:opts.indexOf(correct)};
  });
  L = {items: items.map(q => ({type:'grammar', data:q})), idx:0, correct:0, wrong:0, isIELTS:'listening', transcript:set.transcript, setTitle:set.title};
  cur = {correct:-1, answered:false};
  go('lesson');
}

function startIELTSReading(){
  const rnd = mulberry32(Date.now() % 9999);
  const p = IELTS.readingPassages[Math.floor(rnd() * IELTS.readingPassages.length)];
  const items = p.questions.map(q => {
    const correct = q.opts[q.a];
    const opts = shuffle(q.opts, rnd);
    return {q:q.q, opts, a:opts.indexOf(correct)};
  });
  L = {items: [{type:'reading', data:{title:p.title, text:p.text, qs:items}}], idx:0, correct:0, wrong:0, isIELTS:'reading'};
  cur = {correct:-1, answered:false};
  go('lesson');
}

function startIELTSWriting(){
  const rnd = mulberry32(Date.now() % 9999);
  const isTask1 = rnd() < 0.5;
  const task = isTask1
    ? IELTS.writingTask1[Math.floor(rnd() * IELTS.writingTask1.length)]
    : IELTS.writingTask2[Math.floor(rnd() * IELTS.writingTask2.length)];
  L = {items: [{type:'writing', data:{prompt: task.prompt, hints: task.checklist.join(' · '), sample: 'См. пример в разделе Stats.', checklist: task.checklist}}], idx:0, correct:0, wrong:0, isIELTS:'writing'};
  cur = {correct:-1, answered:false};
  go('lesson');
}

/* ============================================================

============================================================ */
document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  go(btn.dataset.view);
});

document.getElementById('main').addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(a === 'speak'){ speak(el.dataset.text); return; }
  if(a === 'speak-prompt'){ speak(el.dataset.text, 0.95); return; }
  if(a === 'open-settings'){ go('settings'); return; }
  if(a === 'go-home'){ go('home'); return; }
  if(a === 'go-exam'){ go('exam'); return; }
  if(a === 'go-speaking'){ go('speaking'); return; }
  if(a === 'start-test'){ T = null; go('test'); return; }
  if(a === 'test-answer'){ answerTest(+el.dataset.idx); return; }
  if(a === 'start-lesson'){ startLesson(); return; }
  if(a === 'start-checkpoint'){ startCheckpoint(); return; }
  if(a === 'answer'){ answerStep(+el.dataset.idx); return; }
  if(a === 'reading-answer'){ answerReading(+el.dataset.q, +el.dataset.idx); return; }
  if(a === 'next'){ nextStep(); return; }
  if(a === 'check-writing'){ checkWriting(); return; }
  if(a === 'show-sample'){
    const item = L.items[L.idx];
    document.getElementById('sampleBox').innerHTML = `
      <div class="fb" style="margin-top:14px">
        <b>Пример:</b><br>${esc(item.data.sample)}
        <div style="margin-top:8px"><button class="speak" data-action="speak" data-text="${esc(item.data.sample)}">🔊</button></div>
      </div>`;
    return;
  }
  if(a === 'review-due'){ startReviewDue(); return; }
  if(a === 'export-anki'){ exportAnki(); return; }
  if(a === 'ielts-listening'){ startIELTSListening(); return; }
  if(a === 'ielts-reading'){ startIELTSReading(); return; }
  if(a === 'ielts-writing'){ startIELTSWriting(); return; }
  if(a === 'speaking-part'){
    window._speakingPart = parseInt(el.dataset.part);
    render();
    return;
  }
  if(a === 'speak-preview'){
    renderSpeakingFull(document.getElementById('main'));
    return;
  }
  if(a === 'toggle-rec'){ toggleRec(); return; }
  if(a === 'set-target'){
    S.ieltsTarget = parseFloat(el.dataset.band);
    saveState();
    render();
    return;
  }
  if(a === 'set-speaking-score'){
    const b = parseFloat(el.dataset.band);
    S.ieltsScores.speaking = b;
    saveState();
    alert(`Speaking band: ${b.toFixed(1)}. Общий IELTS: ${overallBand().toFixed(1)}`);
    render();
    return;
  }
  if(a === 'retake-test'){
    if(confirm('Пройти тест заново? Программа и карточки будут сброшены.')){
      T = null; L = null;
      go('test');
    }
    return;
  }
  if(a === 'reset'){
    if(confirm('Удалить ВЕСЬ прогресс?')){
      localStorage.removeItem(STORAGE_KEY);
      S = defaultState();
      L = null; T = null;
      view = 'home';
      render();
    }
    return;
  }
});

// Update IELTS score after lesson
const _origFinish = finishLesson;
finishLesson = function(){
  _origFinish();
  // If it was an IELTS test, update scores
  if(L && L.isIELTS){
    const total = L.correct + L.wrong;
    const pct = total > 0 ? L.correct / total : 0;
    if(L.isIELTS === 'listening'){
      S.ieltsScores.listening = estimateBand('listening', pct);
    } else if(L.isIELTS === 'reading'){
      S.ieltsScores.reading = estimateBand('reading', pct);
    } else if(L.isIELTS === 'writing'){
      // Writing: ask user for self-assessment
      const b = parseFloat(prompt('Оцените своё эссе по IELTS (5.0–8.0):', '6.5') || '0');
      if(b >= 4 && b <= 9) S.ieltsScores.writing = b;
    }
    S.ieltsHistory.push({date: today(), scores: {...S.ieltsScores}});
    if(S.ieltsHistory.length > 30) S.ieltsHistory = S.ieltsHistory.slice(-30);
    saveState();
  }
  L = null;
};
